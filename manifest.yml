---
applications:
  - name: cap-atc-ui
    random-route: false
    path: .
    buildpack: nodejs_buildpack
    memory: 2048M
    disk_quota: 1024M
    instances: 3
    command: npm start
    env:
      NODE_MODULES_CACHE: false
      SAP_CLIENT: "100"
      SAP_DESTINATION: i10_ATC
    services:
      - atc-destination-service
      - atc-connectivity-service
      - atc-xsuaa-service
